<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisaab - Krishi Mitra</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f8e9;
            margin: 0;
            padding: 30px;
        }

        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px #0001;
        }

        h1 {
            color: #1b5e20;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f9fff5;
            border-radius: 12px;
        }

        .result p {
            font-size: 18px;
        }

        .profit {
            font-size: 24px;
            font-weight: bold;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>💰 किसान का हिसाब</h1>

    <form method="get" action="{{ url_for('hisaab') }}">

        <label>💸 कुल खर्च (₹)</label>
        <input
            type="number"
            name="expense"
            placeholder="जैसे 10000"
            min="0"
            step="0.01"
            value="{{ expense if expense else '' }}"
        >

        <label>💵 कुल कमाई (₹)</label>
        <input
            type="number"
            name="income"
            placeholder="जैसे 25000"
            min="0"
            step="0.01"
            value="{{ income if income else '' }}"
        >

        <button type="submit">हिसाब निकालें</button>

    </form>

    {% if expense or income %}

    <div class="result">

        <p>💸 कुल खर्च: ₹{{ "%.2f"|format(expense) }}</p>

        <p>💵 कुल कमाई: ₹{{ "%.2f"|format(income) }}</p>

        <p class="profit">
            {% if profit >= 0 %}
                🟢 लाभ: ₹{{ "%.2f"|format(profit) }}
            {% else %}
                🔴 नुकसान: ₹{{ "%.2f"|format(profit|abs) }}
            {% endif %}
        </p>

    </div>

    {% endif %}

    <a href="{{ url_for('dashboard') }}">← Dashboard पर वापस जाएँ</a>

</div>

</body>
</html>
