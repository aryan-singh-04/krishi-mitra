<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop - Krishi Mitra</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f8e9;
            margin: 0;
            padding: 30px;
        }

        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px #0001;
        }

        h1 {
            color: #1b5e20;
            text-align: center;
        }

        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .info {
            margin-top: 25px;
            background: #f9fff5;
            padding: 20px;
            border-radius: 12px;
        }

        .info p {
            font-size: 18px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🌱 फसल की जानकारी</h1>

    <form method="get" action="{{ url_for('crop') }}">

        <select name="crop">
            {% for key, crop in crops.items() %}
                <option value="{{ key }}"
                    {% if key == selected_crop %}selected{% endif %}>
                    {{ crop.name }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">फसल की जानकारी देखें</button>

    </form>

    <div class="info">

        <h2>🌱 {{ crop_info.name }}</h2>

        <p>📅 मौसम: {{ crop_info.season }}</p>

        <p>💧 पानी की आवश्यकता: {{ crop_info.water }}</p>

        <p>🌍 मिट्टी: {{ crop_info.soil }}</p>

    </div>

    <a href="{{ url_for('dashboard') }}">← Dashboard पर वापस जाएँ</a>

</div>

</body>
</html>
