<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Signup - Krishi Mitra</title><style>body{font-family:Arial;background:#f1f8e9;display:grid;place-items:center;min-height:100vh}.box{background:white;width:min(420px,92%);padding:30px;border-radius:16px;box-shadow:0 5px 25px #0001}h1{color:#1b5e20;margin-bottom:10px}p{color:#607d8b;margin-bottom:20px}input{width:100%;padding:13px;margin:8px 0;border:1px solid #cfd8dc;border-radius:8px}button{width:100%;padding:13px;background:#2e7d32;color:#fff;border:0;border-radius:8px;font-weight:bold;margin-top:10px}.msg{padding:10px;border-radius:8px;margin:8px 0;background:#ffebee}.success{background:#e8f5e9}.links{margin-top:18px;text-align:center}a{color:#2e7d32}</style></head><body><div class="box"><h1>🌾 Signup</h1><p>अपना Krishi Mitra account बनाएँ</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="msg {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Password (कम से कम 6 characters)" minlength="6" required><button type="submit">Account बनाएँ</button></form><div class="links">पहले से account है? <a href="{{ url_for('login') }}">Login करें</a></div></div></body></html>
